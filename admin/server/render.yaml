services:
  - type: web
    name: portfolio-admin-server
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ADMIN_PIN
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_DURATION_HOURS
        value: 24
